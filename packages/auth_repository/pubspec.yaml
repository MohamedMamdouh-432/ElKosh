publish_to: none
environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^5.4.0
  equatable: ^2.0.5
  firebase_auth: ^5.3.1
  firebase_core: ^3.4.0
  either_dart: ^1.0.0
  shared_preferences: ^2.3.2
  google_sign_in: ^6.2.1
  models_repository:
    path: ../models_repository

dev_dependencies:
  flutter_test:
    sdk: flutter
