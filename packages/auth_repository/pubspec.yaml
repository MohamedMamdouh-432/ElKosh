name: auth_repository
description: Dart package which manages the authentication domain.
version: 1.0.0
publish_to: none
environment:
  sdk: ^3.5.2

dependencies:
  cloud_firestore: ^5.6.5
  dio: ^5.8.0+1
  either_dart: ^1.0.0
  equatable: ^2.0.7
  firebase_auth: ^5.5.1
  firebase_core: ^3.12.1
  flutter:
    sdk: flutter
  google_sign_in: ^6.3.0
  models_repository:
    path: ../models_repository
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter