name: elkosh
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  auth_repository:
    path: packages/auth_repository
  data_repository:
    path: packages/data_repository
  models_repository:
    path: packages/models_repository
  user_repository:
    path: packages/user_repository
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  app_settings: ^5.2.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  cloud_firestore: ^5.6.5
  conditional_builder_null_safety: ^0.0.6
  cupertino_icons: ^1.0.8
  device_preview: ^1.2.0
  dio: ^5.8.0+1
  equatable: ^2.0.7
  fancy_shimmer_image: ^2.0.3
  firebase_auth: ^5.5.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_storage: ^12.4.4
  flutter_bloc: ^9.1.0
  flutter_local_notifications: ^18.0.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  font_awesome_flutter: ^10.8.0
  formz: ^0.8.0
  gap: ^3.0.1
  geodesy: ^0.10.2
  get_it: ^8.0.3
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  googleapis_auth: ^1.6.0
  http: ^1.3.0
  intl: ^0.19.0
  latlng: ^2.0.7
  location_picker_flutter_map: ^3.0.1
  modal_progress_hud_nsn: ^0.5.1
  pinput: ^5.0.1
  provider: ^6.1.2
  quickalert: ^1.1.0
  shared_preferences: ^2.5.2
  shimmer: ^3.0.0
  skeletonizer: ^1.4.3
  super_banners: ^0.0.1
  url_launcher: ^6.3.1
  badges: ^3.1.2
  expandable: ^5.0.1
  curved_navigation_bar: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  hive_generator: ^2.0.1
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  # dart run flutter_launcher_icons
  image_path: "assets/AppPhoto.jpg"
  android: true
  ios: false

flutter_native_splash:
  # dart run flutter_native_splash:create
  # dart run flutter_native_splash:remove
  color: "#000000"
  fullscreen: true
  image: assets/AppPhoto2.png
  android_12:
    color: "#000000"
    color_dark: "#ffffff"
    image: assets/AppPhoto2.png
    fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/
