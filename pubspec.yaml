name: elkosh
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^8.1.6
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  either_dart: ^1.0.0
  gap: ^3.0.1
  conditional_builder_null_safety: ^0.0.6
  cached_network_image: ^3.4.0
  formz: ^0.7.0
  skeletonizer: ^1.4.2
  intl: ^0.19.0
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  firebase_storage: ^12.2.0
  cloud_firestore: ^5.4.0
  get_it: ^7.7.0
  go_router: ^14.2.7
  equatable: ^2.0.5
  flutter_spinkit: ^5.2.1
  loading_animation_widget: ^1.2.1
  modal_progress_hud_nsn: ^0.5.1
  quickalert: ^1.1.0
  another_carousel_pro: ^1.0.2
  google_nav_bar: ^5.0.6
  flutter_localizations:
    sdk: flutter
  data_repository: 
    path: packages/data_repository
  auth_repository: 
    path: packages/auth_repository
  user_repository:
    path: packages/user_repository
  models_repository: 
    path: packages/models_repository

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  # dart run flutter_launcher_icons
  image_path: "assets/Kheer_Icon.png"
  android: true
  ios: false
  
flutter_native_splash:
  # dart run flutter_native_splash:create
  # dart run flutter_native_splash:remove

  color: "#ffffff"
  color_dark: "#ffffff"
  image: assets/Kheer_Splash.png
  background_image: assets/background.png

  android_12:
    color: "#ffffff"
    color_dark: "#ffffff"
    image: assets/Kheer_Splash.png
    background_image: assets/background.png

flutter:
  uses-material-design: true
  assets:
    - assets/