name: elkosh
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^8.1.6
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  either_dart: ^1.0.0
  gap: ^3.0.1
  flutter_spinkit: ^5.2.1
  awesome_dialog: ^3.2.1
  conditional_builder_null_safety: ^0.0.6
  cached_network_image: ^3.4.0
  formz: ^0.7.0
  fancy_shimmer_image: ^2.0.3
  skeletonizer: ^1.4.2
  intl: ^0.19.0
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  firebase_storage: ^12.2.0
  cloud_firestore: ^5.4.0
  data_repository: 
    path: packages/data_repository
  auth_repository: 
    path: packages/auth_repository
  user_repository:
    path: packages/user_repository
  models_repository: 
    path: packages/models_repository
  get_it: ^7.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  # dart run flutter_launcher_icons
  image_path: "assets/logo.png"
  android: true
  ios: false
  
flutter_native_splash:
  # dart run flutter_native_splash:create
  # dart run flutter_native_splash:remove

  color: "#F6D880"
  color_dark: "#F6D880"
  image: assets/logo_splash.png
  image_dark: assets/logo_splash.png

  android_12:
    color: "#F6D880"
    color_dark: "#F6D880"
    image: assets/logo_splash.png
    image_dark: assets/logo_splash.png

flutter:
  uses-material-design: true
  assets:
    - assets/