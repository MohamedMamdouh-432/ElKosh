  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.6
  firebase_storage: ^12.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_local_notifications: ^18.0.1
  flutter_localizations:
